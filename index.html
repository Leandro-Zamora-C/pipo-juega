<style>
:root { --bg1: #bdeeff; --bg2: #e8fbff; --ink: #2b2140; --pink: #ff6fa8; --yel: #ffd54a; --blue: #4fb7ff; --green: #5ad16b; --org: #ff9f43; --pur: #a77bff; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #bdeeff; font-family: 'Baloo 2', 'Comic Sans MS', 'Trebuchet MS', system-ui, sans-serif; color: var(--ink); touch-action: manipulation; }
button { font-family: inherit; cursor: pointer; border: 0; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; }
.screen.on { display: flex; }
.emo { font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; line-height: 1; display: inline-block; }

.cloud { position: absolute; background: #fff; border-radius: 999px; opacity: .9; animation: drift linear infinite; }

.cloud::before { width: 55%; height: 140%; left: 15%; top: -60%; } .cloud::after { width: 40%; height: 110%; left: 50%; top: -40%; }
@keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }
.title { font-weight: 800; font-size: clamp(38px, 9vmin, 84px); line-height: .9; color: #fff; text-shadow: 0 5px 0 #ff6fa8, 0 9px 0 #c2427a, 0 12px 18px rgba(0,0,0,.18); letter-spacing: 1px; text-align: center; z-index: 1; }
.subtitle { font-size: clamp(15px, 2.6vmin, 22px); font-weight: 700; color: #3a2c5c; background: rgba(255,255,255,.75); padding: 4px 16px; border-radius: 999px; z-index: 1; text-align: center; }
#homeMascot { width: clamp(130px, 30vmin, 260px); z-index: 1; animation: bob 2.4s ease-in-out infinite; cursor: pointer; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-12px) rotate(2deg); } }
.bigbtn { font-weight: 800; font-size: clamp(24px, 5vmin, 40px); color: #fff; padding: .25em 1.3em .3em; border-radius: 999px; background: linear-gradient(#7ee36d, #36b54a); box-shadow: 0 8px 0 #23843a, 0 12px 20px rgba(0,0,0,.2); z-index: 1; transition: transform .1s; }
.bigbtn:active { transform: translateY(6px); box-shadow: 0 2px 0 #23843a; }
.homerow { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; z-index: 1; }
.pill { font-weight: 800; font-size: clamp(15px, 2.6vmin, 20px); padding: 8px 18px; border-radius: 999px; background: #fff; color: #3a2c5c; box-shadow: 0 5px 0 #c9b8ef; display: inline-flex; align-items: center; gap: 6px; }
.pill:active { transform: translateY(4px); box-shadow: 0 1px 0 #c9b8ef; }
.progress-home { width: min(520px, 86vw); height: 22px; background: rgba(255,255,255,.75); border-radius: 999px; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,.12); z-index: 1; position: relative; }
.progress-home > i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #ffd54a, #ff9f43, #ff6fa8); border-radius: 999px; }
.progress-home > b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #3a2c5c; }
.credit { position: absolute; bottom: max(8px, env(safe-area-inset-bottom)); font-size: 12px; color: #2f5d34; font-weight: 700; z-index: 1; }

#game { background: var(--bg1); }
#topbar { height: 60px; flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px max(10px, env(safe-area-inset-right)) 4px max(10px, env(safe-area-inset-left)); z-index: 20; }
.ibtn { width: 46px; height: 46px; border-radius: 16px; background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.15); font-size: 24px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.ibtn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.15); }
#lvlBadge { font-weight: 800; font-size: 20px; background: #fff; padding: 2px 14px; border-radius: 999px; box-shadow: 0 5px 0 rgba(0,0,0,.15); white-space: nowrap; }
#lvlBar { flex: 1; height: 16px; background: rgba(255,255,255,.7); border-radius: 999px; overflow: hidden; min-width: 0; }
@media (max-width: 480px) { #lvlBar { visibility: hidden; } #topbar { gap: 6px; } .ibtn { width: 42px; height: 42px; font-size: 21px; } #lvlBadge, #starCount { font-size: 16px; padding: 2px 10px; } }
#lvlBar > i { display: block; height: 100%; background: linear-gradient(90deg, #ffd54a, #ff9f43, #ff6fa8); border-radius: 999px; transition: width .6s; }
#starCount { font-weight: 800; font-size: 18px; background: #fff; padding: 2px 12px; border-radius: 999px; box-shadow: 0 5px 0 rgba(0,0,0,.15); white-space: nowrap; }
#stage { position: relative; flex: 1; overflow: hidden; touch-action: none; }
#guide { position: absolute; left: 10px; bottom: 10px; z-index: 15; display: flex; align-items: flex-end; gap: 6px; pointer-events: none; max-width: 70%; }
#guideMascot { width: clamp(64px, 13vmin, 110px); flex: 0 0 auto; transition: transform .3s; pointer-events: auto; cursor: pointer; }
#guide.talk #guideMascot { animation: talk .5s ease-in-out 3; }
@keyframes talk { 50% { transform: rotate(-6deg) scale(1.06); } }
#bubble.hide { opacity: 0; }
#bubble { transition: opacity .5s; background: #fff; border-radius: 22px 22px 22px 6px; padding: 8px 14px; font-weight: 800; font-size: clamp(16px, 3.1vmin, 26px); box-shadow: 0 6px 0 rgba(0,0,0,.08); margin-bottom: 40%; line-height: 1.1; transform-origin: 0 100%; animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
#hand { position: absolute; z-index: 30; font-size: 54px; pointer-events: none; display: none; filter: drop-shadow(0 4px 4px rgba(0,0,0,.25)); }
#hand.on { display: block; animation: handtap 1s ease-in-out infinite; }
@keyframes handtap { 0%,100% { transform: translate(-20%, 10%) scale(1); } 50% { transform: translate(-20%, -8%) scale(.9); } }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
#win { position: absolute; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px; background: radial-gradient(circle, rgba(255,255,255,.55), rgba(255,255,255,0) 70%); }
#win.on { display: flex; }
#win .wtxt { font-weight: 800; font-size: clamp(40px, 10vmin, 96px); color: #fff; text-shadow: 0 5px 0 #ff9f43, 0 9px 0 #c86a1c, 0 14px 20px rgba(0,0,0,.2); animation: pop .5s cubic-bezier(.2,1.6,.4,1); text-align: center; }
#win .wstars { font-size: clamp(36px, 8vmin, 70px); animation: pop .6s .15s cubic-bezier(.2,1.6,.4,1) both; }
#win button { animation: pop .5s .3s both; }
.sparkle { position: fixed; pointer-events: none; z-index: 60; font-size: 22px; animation: spk .8s ease-out forwards; }
@keyframes spk { to { transform: translate(var(--dx), var(--dy)) scale(.2) rotate(180deg); opacity: 0; } }
.shake { animation: shake .45s; }
@keyframes shake { 20%,60% { transform: translateX(-10px) rotate(-4deg); } 40%,80% { transform: translateX(10px) rotate(4deg); } }
.boing { animation: boing .5s cubic-bezier(.2,1.6,.4,1); }
@keyframes boing { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
.dragging { z-index: 100 !important; filter: drop-shadow(0 12px 10px rgba(0,0,0,.25)); transition: none !important; }
.back { transition: transform .35s cubic-bezier(.3,1.5,.5,1) !important; }
.center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.card { background: #fff; border-radius: 22px; box-shadow: 0 7px 0 rgba(0,0,0,.12); display: flex; align-items: center; justify-content: center; }
.choice { transition: transform .15s; cursor: pointer; }
.choice:active { transform: scale(.92); }
/* álbum y categorías */
.panel { position: absolute; inset: 0; z-index: 70; background: rgba(43,33,64,.45); display: none; align-items: center; justify-content: center; padding: 14px; }
.panel.on { display: flex; }
.sheet { background: #fff; border-radius: 28px; padding: 18px; width: min(760px, 96vw); max-height: 92vh; overflow: auto; box-shadow: 0 10px 0 rgba(0,0,0,.12); animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
.sheet h2 { margin: 0 0 8px; font-size: 28px; text-align: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.cat { background: #f4efff; border-radius: 20px; padding: 10px 6px; text-align: center; font-weight: 800; font-size: 14px; line-height: 1.05; box-shadow: 0 5px 0 #d8ccf7; }
.cat .emo { font-size: 40px; display: block; margin-bottom: 4px; }
.cat:active { transform: translateY(3px); box-shadow: 0 2px 0 #d8ccf7; }
.stk { aspect-ratio: 1; border-radius: 18px; background: #f4efff; display: flex; align-items: center; justify-content: center; font-size: 44px; box-shadow: inset 0 0 0 3px #e3d9fb; }
.stk.lock { filter: grayscale(1) opacity(.25); font-size: 28px; }
.toggles { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
@media (max-height: 460px) { #topbar { height: 50px; padding-top: 4px; } .ibtn { width: 40px; height: 40px; font-size: 20px; } #lvlBadge, #starCount { font-size: 15px; } }
</style>
</head>
<body>
<div id="app">
  <!-- INICIO -->
  <section id="home" class="screen on">
    <div class="cloud" style="width:150px;height:44px;top:9%;animation-duration:48s;animation-delay:-10s"></div>
    <div class="cloud" style="width:110px;height:34px;top:22%;animation-duration:62s;animation-delay:-40s"></div>
    <div class="cloud" style="width:180px;height:50px;top:4%;animation-duration:75s;animation-delay:-60s"></div>
    <div id="homeMascot" onclick="pipoPoke(this)"></div>

    <div class="progress-home"><i id="homeBar"></i><b id="homeTxt"></b></div>
    <div class="homerow">
      <button class="pill" onclick="openCats()"><span class="emo">🎲</span> Elegir juego</button>
      <button class="pill" onclick="openAlbum()"><span class="emo">📒</span> Mis stickers</button>
      <button class="pill" onclick="openParents()"><span class="emo">⚙️</span> Papás</button>
    </div>
    <div class="credit">Hecho con cariño por Leandro Zamora</div>
  </section>
  <!-- JUEGO -->
  <section id="game" class="screen">
    <div id="topbar">
      <button class="ibtn" onclick="goHome()" aria-label="Inicio"><span class="emo">🏠</span></button>
      <span id="lvlBadge">Nivel 1</span>
      <div id="lvlBar"><i></i></div>
      <span id="starCount">⭐ 0</span>
      <button class="ibtn" id="sndBtn" onclick="toggleSound()" aria-label="Sonido"><span class="emo">🔊</span></button>
      <button class="ibtn" onclick="repeatSay()" aria-label="Repetir instrucción"><span class="emo">💬</span></button>
    </div>
    <div id="stage"></div>
    <div id="guide"><div id="guideMascot" onclick="repeatSay()"></div><div id="bubble"></div></div>
    <div id="hand" class="emo">👆</div>
    <div id="win"><div class="wtxt" id="winTxt">¡Muy bien!</div><div class="wstars emo">⭐⭐⭐</div><button class="bigbtn" style="font-size:26px" onclick="nextLevel()">Siguiente ▶</button></div>
  </section>
  <!-- PANELES -->
  <div class="panel" id="catPanel" onclick="if(event.target===this)closePanels()"><div class="sheet"><h2>¿A qué jugamos?</h2><div class="grid" id="catGrid"></div><div class="toggles"><button class="pill" onclick="closePanels()">Cerrar</button></div></div></div>
  <div class="panel" id="albumPanel" onclick="if(event.target===this)closePanels()"><div class="sheet"><h2>Mis stickers <span id="albumCount" style="font-size:18px"></span></h2><p style="text-align:center;margin:0 0 10px;font-weight:700">¡Ganas un sticker nuevo cada 10 niveles!</p><div class="grid" id="albumGrid" style="grid-template-columns:repeat(auto-fill,minmax(64px,1fr))"></div><div class="toggles"><button class="pill" onclick="closePanels()">Cerrar</button></div></div></div>
  <div class="panel" id="parentPanel" onclick="if(event.target===this)closePanels()"><div class="sheet"><h2>Para papás</h2>
    <p style="font-weight:700;margin:4px 0 10px;text-align:center">Los niveles pasan solos al completarse. Si tu peque se traba, la manito 👆 le muestra qué hacer.</p>
    <div class="toggles" id="parentToggles"></div>
    <div class="toggles"><button class="pill" onclick="askLevel()"><span class="emo">🔢</span> Ir a un nivel</button><button class="pill" onclick="resetAll()"><span class="emo">♻️</span> Empezar de cero</button><button class="pill" onclick="fullScreen()"><span class="emo">⛶</span> Pantalla completa</button></div>
    <div class="toggles"><button class="pill" onclick="closePanels()">Cerrar</button></div></div></div>
  <canvas id="fx"></canvas>
</div>

      const pth = document.createElementNS('http://www.w3.org/2000/svg', 'path'); pth.setAttribute('d', `M${x1} ${y1}Q${(x1 + x2) / 2} ${Math.min(y1, y2) - 80} ${x2} ${y2}`); pth.setAttribute('stroke', '#5fd3ff'); pth.setAttribute('stroke-width', '12'); pth.setAttribute('fill', 'none'); pth.setAttribute('stroke-linecap', 'round'); pth.setAttribute('opacity', '.85'); pth.setAttribute('stroke-dasharray', '18 10'); water.appendChild(pth); setTimeout(() => pth.remove(), 450);
      sparkle(fr.left + fr.width / 2, fr.top + fr.height / 2, 6, ['💧', '💦']);
      f.hp--; f.style.transform = `scale(${.4 + f.hp * .3})`;
      if (f.hp <= 0) { f.out = true; f.remove(); const pt = f.w.querySelector('.pet'); pt.style.opacity = '1'; bump(pt); AU.sfx('ok'); if (fires.every(x => x.out)) { VO.say('¡Apagaste el fuego! ¡Todos a salvo!', false); setTimeout(c.done, 900); } }
    }
    c.say('¡Apaga el fuego! Toca las llamas para echar agua');
    c.hint = () => fires.find(f => !f.out); c.solve = () => fires.forEach(f => { while (!f.out) spray(f); });
  }
};
/* =====================================================================
   19. TÚNEL DEL CONEJO
===================================================================== */
TYPES.tunel = {
  name: 'Túnel del conejo', icon: '🥕', bg: 'linear-gradient(#bff0ff 0 16%, #8fdc6a 16% 19%, #7a4a24 19%)',
  make(c) {
    c.noRestart = true;
    const top = c.H * .19, W = c.W, H = c.H - top, U = unit(c);
    const cv = mk('canvas', '', null, c.stage, `position:absolute;left:0;top:${top}px;width:${W}px;height:${H}px;touch-action:none`); const dpr = 1; cv.width = W; cv.height = H; const x = cv.getContext('2d', { willReadFrequently: true });
    x.fillStyle = '#8b5a2b'; x.fillRect(0, 0, W, H); const R0 = rng(5); for (let i = 0; i < 260; i++) { x.fillStyle = R0() < .5 ? 'rgba(60,30,10,.35)' : 'rgba(180,120,60,.3)'; x.beginPath(); x.arc(R0() * W, R0() * H, 2 + R0() * 6, 0, 7); x.fill(); }
    for (let i = 0; i < 8; i++) { x.fillStyle = '#9a9488'; x.beginPath(); x.ellipse(R0() * W, R0() * H, 14 + R0() * 16, 10 + R0() * 10, R0(), 0, 7); x.fill(); }
    const left = c.r() < .5, sx = left ? W * .12 : W * .88, sy = H * .14, ex = left ? W * .82 : W * .18, ey = H * .78, rad = clamp(U * .065, 22, 46);
    x.globalCompositeOperation = 'destination-out';
    const hole = (px, py, r) => { x.beginPath(); x.arc(px, py, r, 0, 7); x.fill(); };
    hole(sx, sy, rad * 1.5); hole(ex, ey, rad * 1.9); for (let k = 0; k < 6; k++) hole(sx, sy - k * 12, rad * 1.2);
    const crate = emoEl('🥕', clamp(U * .1, 40, 80), c.stage, `position:absolute;left:${sx}px;top:${top + sy}px;transform:translate(-50%,-60%) rotate(${left ? -20 : 20}deg);z-index:2;pointer-events:none`);
    const bunny = emoEl('🐰', clamp(U * .16, 60, 120), c.stage, `position:absolute;left:${ex}px;top:${top + ey}px;transform:translate(-50%,-55%);z-index:2;animation:bob 2s infinite;pointer-events:none`);
    const tool = emoEl('⛏️', 48, c.stage, 'position:absolute;pointer-events:none;display:none;z-index:3;transform:translate(-20%,-70%)');
    let digging = false, lp = null, done = false;
    const dig = e => { const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top; tool.style.display = ''; tool.style.left = px + 'px'; tool.style.top = top + py + 'px'; if (lp) { const dx = px - lp[0], dy = py - lp[1], st = Math.max(1, Math.hypot(dx, dy) / (rad * .4)); for (let i = 1; i <= st; i++) hole(lp[0] + dx * i / st, lp[1] + dy * i / st, rad); } else hole(px, py, rad); lp = [px, py]; if (Math.random() < .3) AU.sfx('scrub'); markAct(); };
    cv.addEventListener('pointerdown', e => { digging = true; lp = null; cv.setPointerCapture(e.pointerId); dig(e); });
    cv.addEventListener('pointermove', e => { if (digging) dig(e); });
    cv.addEventListener('pointerup', () => { digging = false; lp = null; tool.style.display = 'none'; check(); });
    const GX = 32, GY = 22;
    function path() {
      const img = x.getImageData(0, 0, W, H).data, open = (gx, gy) => { const px = Math.floor((gx + .5) * W / GX), py = Math.floor((gy + .5) * H / GY); return img[(py * W + px) * 4 + 3] < 60; };
      const s = [Math.floor(sx / W * GX), Math.floor(sy / H * GY)], e = [Math.floor(ex / W * GX), Math.floor(ey / H * GY)];
      const prev = new Map(), q = [s], key = p => p[0] + ',' + p[1]; prev.set(key(s), null);
      while (q.length) { const p = q.shift(); if (Math.abs(p[0] - e[0]) <= 1 && Math.abs(p[1] - e[1]) <= 1) { const out = []; let k = key(p); while (k) { out.unshift(k.split(',').map(Number)); k = prev.get(k); } return out; } for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const n = [p[0] + dx, p[1] + dy]; if (n[0] < 0 || n[1] < 0 || n[0] >= GX || n[1] >= GY || prev.has(key(n)) || !open(n[0], n[1])) continue; prev.set(key(n), key(p)); q.push(n); } }
      return null;
    }
    function check() {
      if (done) return; const p = path(); if (!p) return; done = true; AU.sfx('whoosh');
      let i = 0; crate.style.transition = 'left .045s linear, top .045s linear';
      const roll = () => { if (i >= p.length) { crate.remove(); AU.sfx('chomp'); bump(bunny); sparkleEl(bunny, 14); VO.say('¡Ñam! ¡El conejo tiene sus zanahorias!', false); setTimeout(c.done, 900); return; } crate.style.left = (p[i][0] + .5) * W / GX + 'px'; crate.style.top = top + (p[i][1] + .5) * H / GY + 'px'; i++; setTimeout(roll, 45); };
      roll();
    }
    const timer = setInterval(() => { if (digging) check(); }, 400); c.cleanup = () => clearInterval(timer);
    c.say('Cava un túnel para llevarle las zanahorias al conejo');
    c.hint = () => done ? null : crate;
    c.solve = () => { const st = 30; for (let i = 0; i <= st; i++) hole(sx + (ex - sx) * i / st, sy + (ey - sy) * i / st, rad); check(); };
  }
};
/* =====================================================================
   20. ENCAJAR FORMAS
===================================================================== */
TYPES.formas = {
  name: 'Encaja formas', icon: '🔺', bg: 'linear-gradient(#e3f6ff, #c8ecff)',
  make(c) {
    const n = [3, 3, 4, 5, 6][c.d], shapes = sample(c.r, SHAPES, n), U = unit(c), sz = clamp(Math.min(c.W / (n + 1), c.H * .3) * .9, 54, 150);
    const board = mk('div', '', '', c.stage, `position:absolute;left:4%;right:4%;top:5%;height:42%;background:linear-gradient(#ffcf8a,#f2b25a);border:6px solid #c9822b;border-radius:26px;display:flex;align-items:center;justify-content:space-around;padding:0 3%`);
    const tray = mk('div', '', '', c.stage, 'position:absolute;left:4%;right:4%;bottom:5%;height:40%;display:flex;align-items:center;justify-content:space-around');
    const sv = (s, fill, stroke, extra = '') => `<svg viewBox="-4 -4 108 108" width="100%" style="display:block"><path d="${s.p}" fill="${fill}" stroke="${stroke}" stroke-width="5" stroke-linejoin="round" ${extra}/></svg>`;
    const holes = shapes.map(s => { const h = mk('div', '', sv(s, 'rgba(90,50,10,.55)', '#7a4a14', 'stroke-dasharray="6 5"'), board, `width:${sz}px`); h.s = s; return h; });
    const pieces = shuf(c.r, shapes).map((s, i) => { const col = COLORS[(i * 3 + 2) % 8]; const p = mk('div', '', sv(s, col.h, col.d), tray, `width:${sz * .92}px;cursor:grab;position:relative;filter:drop-shadow(0 6px 0 rgba(0,0,0,.15))`); p.s = s; p.col = col; draggable(p, { targets: () => holes.filter(h => !h.ok), onDrop: (h, p) => drop(h, p) }); return p; });
    function drop(h, p) {
      if (h.s !== p.s) { VO.say(`Ese es ${p.s.a} ${p.s.n}`, false); return false; }
      h.ok = true; p._locked = true; p.style.visibility = 'hidden'; h.innerHTML = sv(h.s, p.col.h, p.col.d); bump(h); AU.sfx('ok'); sparkleEl(h, 8); VO.say(`¡${cap(h.s.n)}!`, false);
      if (holes.every(x => x.ok)) setTimeout(c.done, 500); return true;
    }
    c.say('Pon cada forma en su lugar');
    c.hint = () => pieces.find(p => !p._locked); c.solve = () => pieces.forEach(p => { if (!p._locked) drop(holes.find(h => h.s === p.s), p); });
  }
};
