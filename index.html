<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pipo Juega · 500 minijuegos educativos para niños</title>
<meta name="description" content="500 minijuegos educativos y gratuitos para niños de 2 a 7 años: colores, números, letras, animales, música, emociones y más. Sin anuncios.">
<meta name="theme-color" content="#ffd54a">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Vista previa al compartir (WhatsApp, Facebook). Cambia TU-PAGINA por tu dirección de Vercel -->
<meta property="og:type" content="website">
<meta property="og:title" content="Pipo Juega · 500 minijuegos para niños">
<meta property="og:description" content="Juegos educativos gratis para los más pequeños: colores, números, animales, música y más. ¡Sin anuncios!">
<meta property="og:image" content="https://pipo-juega.vercel.app/img/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div id="app">
  <!-- INICIO -->
  <section id="home" class="screen on">
    <div class="bgwrap" id="homeBg"></div>
    <button id="profChip" onclick="openProfiles()"></button>
    <div id="streakBadge"></div>
    <div id="homeMascot" onclick="homePoke(this)"></div>
    <div class="title" id="homeTitle">Pipo Juega</div>
    <div class="subtitle" id="homeSub"></div>
    <button class="bigbtn" onclick="openMap()">▶ <span id="playLbl"></span></button>
    <div class="progress-home"><i id="homeBar"></i><b id="homeTxt"></b></div>
    <div class="homerow">
      <button class="pill" id="btnMap" onclick="openMap()"></button>
      <button class="pill" id="btnCats" onclick="openCats()"></button>
      <button class="pill" id="btnAlbum" onclick="openAlbum()"></button>
      <button class="pill" id="btnParents" onclick="parentGate(openParents)"></button>
    </div>
    <div id="credit"></div>
  </section>
  <!-- MAPA -->
  <section id="map" class="screen">
    <div class="bgwrap" id="mapBg"></div>
    <div class="maphead"><button class="ibtn" onclick="goHome()" aria-label="Inicio"><span class="emo">🏠</span></button><div id="mapTitle"></div></div>
    <div id="mapTabs"></div>
    <div class="mapscroll"><div id="mapPath"></div></div>
  </section>
  <!-- JUEGO -->
  <section id="game" class="screen">
    <div id="gameBg"></div>
    <div id="topbar">
      <button class="ibtn" onclick="goHome()" aria-label="Inicio"><span class="emo">🏠</span></button>
      <button class="ibtn" onclick="G.mode==='main'?openMap(Math.floor((G.n-1)/50)):openCats()" aria-label="Mapa"><span class="emo">🗺️</span></button>
      <span id="lvlBadge"></span>
      <div id="lvlBar"><i></i></div>
      <span id="starCount">⭐ 0</span>
      <button class="ibtn" id="sndBtn" onclick="toggleSound()" aria-label="Sonido"><span class="emo">🔊</span></button>
      <button class="ibtn opt" onclick="repeatSay()" aria-label="Repetir"><span class="emo">💬</span></button>
    </div>
    <div id="stage"></div>
    <div id="guide"><div id="guideMascot" onclick="repeatSay()"></div><div id="bubble"></div></div>
    <div id="win"><div id="winPipo"></div><div id="winTxt"></div><div id="winSub"></div><button class="bigbtn" onclick="clearTimeout(G.nextT);nextLevel()">▶</button></div>
  </section>
  <!-- CAPAS -->
  <div class="overlay" id="chest"></div>
  <div class="overlay" id="worldIntro"></div>
  <div class="overlay" id="rest"><div id="restPipo"></div><p id="restTxt"></p><button class="pill" id="restBtn" onclick="unlockRest()"></button></div>
  <!-- PANELES -->
  <div class="panel" id="catPanel" onclick="if(event.target===this)closePanels()"><div class="sheet"><h2 id="catTitle"></h2><div class="grid" id="catGrid"></div><div class="toggles"><button class="pill" onclick="closePanels()">✖</button></div></div></div>
  <div class="panel" id="albumPanel" onclick="if(event.target===this)closePanels()"><div class="sheet"><h2 id="albumTitle"></h2><p class="note" id="albumHelp"></p><div class="grid" id="albumGrid" style="grid-template-columns:repeat(auto-fill,minmax(66px,1fr))"></div><div class="toggles"><button class="pill" onclick="closePanels()">✖</button></div></div></div>
  <div class="panel" id="profPanel" onclick="if(event.target===this)closePanels()"><div class="sheet"><h2 id="profTitle"></h2><div id="profList"></div><div class="toggles"><button class="pill" id="profEditBtn" onclick="editProfile(GL.cur)"></button><button class="pill" onclick="closePanels()">✖</button></div></div></div>
  <div class="panel" id="editPanel"><div class="sheet"><h2 id="editTitle"></h2>
    <div class="toggles"><input id="editName" class="inp" maxlength="18" style="width:min(320px,80vw);text-align:center"></div>
    <p class="ph" id="editAgeL"></p><div class="toggles" id="editAges"></div>
    <p class="ph" id="editColL"></p><div class="toggles" id="editColors"></div>
    <p class="ph" id="editAvL"></p><div class="toggles" id="editAvatars"></div>
    <div class="toggles"><button class="bigbtn" style="font-size:24px" id="editSave" onclick="saveProfile()"></button></div>
    <div class="toggles"><button class="pill" id="editDel" onclick="deleteProfile()"></button><button class="pill" onclick="GL.welcomed=true;saveGL();closePanels()">✖</button></div></div></div>
  <div class="panel" id="gatePanel" onclick="if(event.target===this)closePanels()"><div class="sheet" style="width:min(380px,94vw)"><h2 id="gateQ"></h2><div id="gateIn">_</div><div class="toggles" id="gateKeys" style="display:grid;grid-template-columns:repeat(3,auto);justify-content:center"></div><div class="toggles"><button class="pill" onclick="closePanels()">✖</button></div></div></div>
  <div class="panel" id="parentPanel" onclick="if(event.target===this)closePanels()"><div class="sheet"><h2 id="parTitle"></h2><div class="ptabs" id="parTabs"></div><div id="parBody"></div><div class="toggles"><button class="pill" onclick="closePanels()">✖</button></div></div></div>
  <div id="hand" class="emo">👆</div>
  <div id="trans"></div>
  <div id="streakToast"></div>
  <canvas id="fx"></canvas>
</div>
<script src="js/arte.js"></script>
<script src="js/motor.js"></script>
<script src="js/juegos-clasicos.js"></script>
<script src="js/juegos-nuevos.js"></script>
<script src="js/pantallas.js"></script>
<script>document.getElementById('homeBg').innerHTML = bgSVG('cielo');</script>
</body>
</html>
